<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			Sandbox proxy for MCP Apps (docs/architecture/mcp-apps-ui-support.md,
			spike Decision: FALLBACK). This document is trusted and bundled; the
			APP HTML it hosts is hostile. Chromium inherits the webview's CSP
			(nonce + 'strict-dynamic') into nested srcdoc frames, so app inline
			scripts can never execute in a nested frame; instead this document
			renders the app HTML directly into its own DOM and re-executes app
			script elements via createElement insertion. Isolation = the outer
			opaque-origin sandbox set by McpAppFrame (no allow-same-origin -> no
			access to webview DOM, vscode API, or extension state); app scripts
			run under the inherited webview CSP via strict-dynamic propagation
			from the hash-admitted relay script below.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https: data: blob:; style-src 'unsafe-inline' https:; img-src data: blob: https:; font-src data: https:; connect-src *; frame-src 'self';" />
	</head>
	<body>
		<script>
			"use strict"
			let injected = []
			function mountApp(html) {
				for (const node of injected) node.remove()
				injected = []
				const doc = new DOMParser().parseFromString(html, "text/html")
				const container = document.createElement("div")
				container.id = "mcp-app-root"
				const scripts = Array.from(doc.querySelectorAll("head script")).concat(Array.from(doc.body.querySelectorAll("script")))
				for (const node of Array.from(doc.body.childNodes)) {
					if (node.nodeName === "SCRIPT") continue
					container.appendChild(document.importNode(node, true))
				}
				document.body.appendChild(container)
				injected.push(container)
				for (const style of Array.from(doc.querySelectorAll("head style, head link[rel='stylesheet']"))) {
					const copy = document.importNode(style, true)
					document.head.appendChild(copy)
					injected.push(copy)
				}
				for (const script of scripts) {
					const el = document.createElement("script")
					const src = script.getAttribute("src")
					if (src) {
						el.src = src
						const type = script.getAttribute("type")
						if (type) el.type = type
					} else {
						el.textContent = script.textContent
					}
					document.body.appendChild(el)
					injected.push(el)
				}
			}
			window.addEventListener("message", (event) => {
				if (event.source !== window.parent) return
				const data = event.data
				if (data && data.type === "mcp-app-set-html" && typeof data.html === "string") mountApp(data.html)
			})
			window.parent.postMessage({ type: "mcp-app-sandbox-proxy-ready" }, "*")
		</script>
	</body>
</html>
